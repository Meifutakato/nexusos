# Module IA NexusOS (installé par ia-nexusos/install_ia_nexusos.sh)
# Super+A : ouvrir ou fermer l'assistant
bind = SUPER, A, exec, quickshell ipc call assistant basculer

windowrule {
    name = nexus-assistant
    match:title = ^(Assistant NexusOS)$
    float = true
    size = 640 780
    center = true
}
