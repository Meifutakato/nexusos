# NexusOS — veille compressée (phase 6b)
# Chargé par « source = ~/.config/hypr/nexus-veille.conf » à la FIN de hyprland.conf.

# Démarre le service avec les infos de la session Hyprland
exec-once = systemctl --user import-environment HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS && systemctl --user restart nexus-veille

# Le lanceur ouvre chaque appli dans son propre compartiment → elle peut être mise en veille
unbind = SUPER, SPACE
bind = SUPER, SPACE, exec, rofi -show drun -run-command "nexus-veille lance {cmd}"
