# NexusOS — écran de verrouillage NexusOS
background {
    path = /usr/share/backgrounds/nexusos/galaxie-nexus.jpg
    blur_passes = 2
    blur_size = 6
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e6ecffff)
    font_size = 96
    font_family = Noto Sans
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(9aa8d6ff)
    font_size = 20
    font_family = Noto Sans
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    size = 320, 52
    outline_thickness = 2
    outer_color = rgba(4f8bffcc)
    inner_color = rgba(0c163acc)
    font_color = rgba(e6ecffff)
    placeholder_text = Mot de passe
    rounding = 26
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
