# ═══════════════════════════════════════════════════════════
#  NexusOS — thème officiel (Hyprland)
#  Bleu nuit, verre translucide, lueur bleue.
# ═══════════════════════════════════════════════════════════

# ── Écran ──────────────────────────────────────────────────
monitor = , preferred, auto, 1

# ── Réglages propres à la machine (VirtualBox, etc.) ───────
# Généré par l'installeur, peut être vide sur une vraie machine.
source = ~/.config/hypr/machine.conf

# ── Programmes ─────────────────────────────────────────────
$terminal = kitty
$fichiers = thunar
$menu     = rofi -show drun -theme ~/.config/rofi/nexusos.rasi
$fond     = /usr/share/backgrounds/nexusos/galaxie-nexus.jpg

exec-once = swaybg -i $fond -m fill
exec-once = waybar
# Barre du bas NexusOS (~/.config/quickshell)
exec-once = quickshell
exec-once = dunst

# Flou derrière la barre du bas (effet verre)
layerrule {
    name = nexus-barre
    match:namespace = nexus-barre
    blur = true
    ignore_alpha = 0.3
}

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ── Clavier et souris ──────────────────────────────────────
input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── Apparence ──────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(4f8bffee) rgba(8b5cf6ee) 45deg
    col.inactive_border = rgba(1c2a5a99)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(2f6bff44)
    }
}

animations {
    enabled = true
    bezier = douce, 0.22, 1, 0.36, 1
    bezier = rebond, 0.34, 1.4, 0.64, 1
    animation = windows, 1, 5, rebond, popin 85%
    animation = windowsOut, 1, 4, douce, popin 85%
    animation = border, 1, 8, douce
    animation = fade, 1, 5, douce
    animation = workspaces, 1, 5, douce, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ── Raccourcis NexusOS ─────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, SPACE, exec, $menu
bind = $mod, E, exec, $fichiers
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod SHIFT, L, exec, hyprlock
bind = $mod SHIFT, M, exit,

# Outils NexusOS
bind = $mod, G, exec, $terminal --hold nexus-gameresume --list
bind = $mod SHIFT, G, exec, pkill -USR1 -f nexus-shadowrecord
bind = $mod, S, exec, $terminal --hold nexus-safezone --list

# Captures d'écran (copiées dans le presse-papiers)
bind = , Print, exec, grim - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

# Déplacer le focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Bureaux 1 à 9 (touches du haut du clavier AZERTY)
bind = $mod, ampersand, workspace, 1
bind = $mod, eacute, workspace, 2
bind = $mod, quotedbl, workspace, 3
bind = $mod, apostrophe, workspace, 4
bind = $mod, parenleft, workspace, 5
bind = $mod, minus, workspace, 6
bind = $mod, egrave, workspace, 7
bind = $mod, underscore, workspace, 8
bind = $mod, ccedilla, workspace, 9
bind = $mod SHIFT, ampersand, movetoworkspace, 1
bind = $mod SHIFT, eacute, movetoworkspace, 2
bind = $mod SHIFT, quotedbl, movetoworkspace, 3
bind = $mod SHIFT, apostrophe, movetoworkspace, 4
bind = $mod SHIFT, parenleft, movetoworkspace, 5

# Souris : Super + clic gauche déplace, clic droit redimensionne
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Son
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
