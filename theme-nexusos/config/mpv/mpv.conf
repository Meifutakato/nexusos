# NexusOS — Lecteur NexusOS (moteur mpv, interface uosc aux couleurs du thème)

# Affichage : carte graphique si possible, sinon dessin par le processeur (VirtualBox).
# mpv essaie dans l'ordre et prend le premier qui marche : rien à changer entre VM et vrai PC.
vo=gpu-next,gpu,wlshm,
hwdec=auto-safe

# Fenêtre et lecture
keep-open=yes
save-position-on-quit=yes
autofit-larger=85%x85%
osd-bar=no
border=no

# Langue : français en priorité
alang=fr,fre,fra,en,eng
slang=fr,fre,fra,en,eng

# Captures d'écran dans Images
screenshot-directory=~/Images
screenshot-format=png
